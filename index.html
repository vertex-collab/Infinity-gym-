async function hashPw(pw){
  const d=new TextEncoder().encode(pw+SEC);
  const h=await crypto.subtle.digest("SHA-256",d);
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function chkPw(pw,hash){return(await hashPw(pw))===hash;}

// Convert Firestore REST value → JS value
function fsVal(v){
  if(!v)return null;
  if(v.stringValue!==undefined)return v.stringValue;
  if(v.integerValue!==undefined)return parseInt(v.integerValue);
  if(v.doubleValue!==undefined)return parseFloat(v.doubleValue);
  if(v.booleanValue!==undefined)return v.booleanValue;
  if(v.nullValue!==undefined)return null;
  if(v.mapValue)return fsDoc(v.mapValue.fields||{});
  if(v.arrayValue)return(v.arrayValue.values||[]).map(fsVal);
  return null;
}
// Convert Firestore REST fields → plain JS object
function fsDoc(fields){
  const o={};
  for(const k in fields)o[k]=fsVal(fields[k]);
  return o;
}
// Convert JS value → Firestore REST value
function toFsVal(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==="boolean")return{booleanValue:v};
  if(typeof v==="number")return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==="string")return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(toFsVal)}};
  if(typeof v==="object"){
    const fields={};
    for(const k in v)fields[k]=toFsVal(v[k]);
    return{mapValue:{fields}};
  }
  return{stringValue:String(v)};
}
// Convert plain JS object → Firestore REST fields
function toFsFields(obj){
  const fields={};
  for(const k in obj)fields[k]=toFsVal(obj[k]);
  return fields;
}

async function dbGetAll(col){
  const url=`${FB_BASE}/${col}?key=${FB_API_KEY}`;
  const res=await fetch(url);
  if(!res.ok)return[];
  const json=await res.json();
  if(!json.documents)return[];
  return json.documents.map(doc=>{
    const id=doc.name.split("/").pop();
    return{id,...fsDoc(doc.fields||{})};
  });
}

async function dbGetWhere(col,field,op,val){
  // Use Firestore runQuery REST endpoint for where queries
  const url=`${FB_BASE}:runQuery?key=${FB_API_KEY}`;
  const fsOp={
    "==":"EQUAL","<":"LESS_THAN","<=":"LESS_THAN_OR_EQUAL",
    ">":"GREATER_THAN",">=":"GREATER_THAN_OR_EQUAL"
  }[op]||"EQUAL";
  const body={structuredQuery:{
    from:[{collectionId:col}],
    where:{fieldFilter:{field:{fieldPath:field},op:fsOp,value:toFsVal(val)}}
  }};
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok)return[];
  const json=await res.json();
  return json
    .filter(r=>r.document)
    .map(r=>{const id=r.document.name.split("/").pop();return{id,...fsDoc(r.document.fields||{})};});
}

async function dbSet(col,id,data){
  // PATCH with updateMask = all field names (creates or updates)
  const fields=toFsFields(data);
  const fieldPaths=Object.keys(fields).map(k=>`updateMask.fieldPaths=${encodeURIComponent(k)}`).join("&");
  const url=`${FB_BASE}/${col}/${id}?${fieldPaths}&key=${FB_API_KEY}`;
  const res=await fetch(url,{
    method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({fields})
  });
  if(!res.ok){const t=await res.text();throw new Error("dbSet failed: "+t);}
}

async function dbDelete(col,id){
  const url=`${FB_BASE}/${col}/${id}?key=${FB_API_KEY}`;
  const res=await fetch(url,{method:"DELETE"});
  if(!res.ok&&res.status!==404){const t=await res.text();throw new Error("dbDelete failed: "+t);}
}

async function dbGetDoc(col,id){
  const url=`${FB_BASE}/${col}/${id}?key=${FB_API_KEY}`;
  const res=await fetch(url);
  if(!res.ok)return null;
  const doc=await res.json();
  if(!doc.name)return null;
  return{id:doc.name.split("/").pop(),...fsDoc(doc.fields||{})};
}

  const [showCust,setShowCust]=useState(false);
  const [pin,setPin]=useState("");
  const [pinErr,setPinErr]=useState("");
  const [drop,setDrop]=useState(false);
  const tapRef=useRef(null);
  const user=getSess();

  useEffect(()=>{
    const h=()=>setCfg(getCfg());
    window.addEventListener("cfgChange",h);
    return()=>window.removeEventListener("cfgChange",h);
  },[]);

  const logoTap=()=>{
    setTaps(prev=>{
      const n=prev+1;
      clearTimeout(tapRef.current);
      tapRef.current=setTimeout(()=>setTaps(0),2000);
      if(n>=5){
        setTaps(0);
        setShowPin(true);
        setPin("");
        setPinErr("");
      }
      return n<5?n:0;
    });
  };

  const submitPin=e=>{
    e.preventDefault();
    if(pin===getCfg().pin){setShowPin(false);setShowCust(true);}
    else{setPinErr("Wrong PIN – try again");setPin("");}
  };

  const g=G(cfg);

  return(
    <>
    <nav style={{position:"fixed",top:0,left:0,right:0,zIndex:200,background:"rgba(0,0,0,.9)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,.08)",height:64,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px"}}>
      {/* LOGO – tap 5x */}
      <div style={{position:"relative"}}>
        <button onClick={logoTap} style={{display:"flex",alignItems:"center",gap:8,background:"none",border:"none",cursor:"pointer",padding:4}}>
          <div style={{width:36,height:36,borderRadius:10,background:g,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Ic n="Infinity" s={20} c="#fff"/>
          </div>
          <span style={{color:"#fff",fontWeight:900,fontSize:18}}>
            {cfg.logoText}<span style={{color:cfg.primary}}>{cfg.logoAccent}</span>
          </span>
        </button>
        {taps>0&&(
          <div style={{position:"absolute",bottom:-16,left:4,display:"flex",gap:3}}>
            {[1,2,3,4,5].map(d=>(
              <div key={d} style={{width:6,height:6,borderRadius:"50%",background:d<=taps?cfg.primary:"#3f3f46",transition:"background .15s"}}/>
            ))}
          </div>
        )}
      </div>

      {page==="landing"&&(
        <div style={{display:"flex",gap:22}}>
          {[["services","Services"],["plans","Plans"],["contact","Contact"]].map(([id,l])=>(
            <a key={id} href={"#"+id} style={{color:"#9ca3af",textDecoration:"none",fontSize:14,fontWeight:500}}
              onMouseEnter={e=>e.target.style.color=cfg.primary}
              onMouseLeave={e=>e.target.style.color="#9ca3af"}>{l}</a>
          ))}
        </div>
      )}

      <div style={{display:"flex",alignItems:"center",gap:10}}>
        {user?(
          <div style={{position:"relative"}}>
            <button onClick={()=>setDrop(!drop)} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.14)",borderRadius:12,padding:"6px 12px",cursor:"pointer"}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:g,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:13}}>{user.name?.[0]}</div>
              <span style={{color:"#fff",fontSize:13,fontWeight:600}}>{user.name?.split(" ")[0]}</span>
              <Ic n="ChevD" s={14} c="#9ca3af"/>
            </button>
            {drop&&(
              <div style={{position:"absolute",right:0,top:"calc(100% + 8px)",background:"#18181b",border:"1px solid rgba(255,255,255,.1)",borderRadius:14,minWidth:180,boxShadow:"0 20px 40px rgba(0,0,0,.5)",overflow:"hidden",zIndex:300,animation:"fadein .15s ease"}}>
                <div style={{padding:"12px 16px",borderBottom:"1px solid rgba(255,255,255,.08)"}}>
                  <div style={{color:"#fff",fontWeight:700,fontSize:14}}>{user.name}</div>
                  <div style={{color:"#6b7280",fontSize:12,marginTop:2}}>{user.member_id} · <span style={{color:cfg.primary}}>{user.role}</span></div>
                </div>
                <button onClick={()=>{setPage(user.role==="admin"?"admin":"dashboard");setDrop(false);}} style={{width:"100%",display:"flex",alignItems:"center",gap:8,padding:"10px 16px",background:"none",border:"none",color:"#d1d5db",fontSize:13,cursor:"pointer"}}>
                  <Ic n="Dashboard" s={14}/>Dashboard
                </button>
                <button onClick={()=>{clrSess();setPage("landing");setDrop(false);}} style={{width:"100%",display:"flex",alignItems:"center",gap:8,padding:"10px 16px",background:"none",border:"none",color:"#f87171",fontSize:13,cursor:"pointer"}}>
                  <Ic n="LogOut" s={14}/>Logout
                </button>
              </div>
            )}
          </div>
        ):(
          <button onClick={()=>setPage("login")} style={{background:g,border:"none",color:"#fff",fontWeight:700,padding:"8px 18px",borderRadius:12,cursor:"pointer",fontSize:14}}>
            Member Login
          </button>
        )}
      </div>
    </nav>

    {/* ── PIN MODAL ── */}
    {showPin&&(
      <div onClick={e=>e.target===e.currentTarget&&setShowPin(false)}
        style={{position:"fixed",inset:0,zIndex:500,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.1)",borderRadius:22,padding:36,width:"100%",maxWidth:360,textAlign:"center",animation:"fadein .2s ease"}}>
          <div style={{width:60,height:60,borderRadius:16,background:g,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}>
            <Ic n="Settings" s={28} c="#fff"/>
          </div>
          <h3 style={{color:"#fff",fontWeight:900,fontSize:20,marginBottom:6}}>Site Customizer</h3>
          <p style={{color:"#6b7280",fontSize:14,marginBottom:22}}>Enter PIN to unlock settings</p>
          <form onSubmit={submitPin}>
            <input type="password" value={pin} onChange={e=>{setPin(e.target.value);setPinErr("");}}
              placeholder="Enter PIN" autoFocus
              style={{width:"100%",background:"#27272a",border:`1px solid ${pinErr?"#ef4444":"rgba(255,255,255,.2)"}`,borderRadius:12,padding:"12px 16px",color:"#fff",fontSize:20,textAlign:"center",letterSpacing:8,outline:"none",marginBottom:8}}/>
            {pinErr&&<p style={{color:"#f87171",fontSize:13,marginBottom:8}}>{pinErr}</p>}
            <button type="submit" style={{width:"100%",background:g,border:"none",color:"#fff",fontWeight:700,padding:13,borderRadius:12,cursor:"pointer",fontSize:15,marginBottom:8}}>
              🔓 Unlock
            </button>
            <button type="button" onClick={()=>setShowPin(false)} style={{background:"none",border:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>Cancel</button>
          </form>
          <p style={{color:"#374151",fontSize:12,marginTop:14}}>Default PIN: <b style={{color:"#6b7280"}}>admin123</b></p>
        </div>
      </div>
    )}

    {/* ── CUSTOMIZER ── */}
    {showCust&&<Customizer cfg={cfg} onSave={c=>{saveCfg(c);setCfg(c);setShowCust(false);}} onClose={()=>setShowCust(false)} onAdminPanel={()=>{clrSess();setPage("adminLogin");}}/>}
    </>
  );
}

function Customizer({cfg,onSave,onClose,onAdminPanel}){
  const [f,setF]=useState({...cfg});
  const u=v=>setF(p=>({...p,...v}));
  const g=G(f);
  return(
    <div style={{position:"fixed",inset:0,zIndex:400,background:"rgba(0,0,0,.6)",display:"flex",justifyContent:"flex-end"}}>
      <div style={{width:"100%",maxWidth:420,background:"#09090b",borderLeft:"1px solid rgba(255,255,255,.1)",overflowY:"auto",padding:24,animation:"fadein .2s ease"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}>
          <h2 style={{color:"#fff",fontWeight:900,fontSize:19}}>⚙️ Site Customizer</h2>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.08)",border:"none",color:"#9ca3af",borderRadius:8,padding:"5px 7px",cursor:"pointer",display:"flex"}}><Ic n="X" s={16}/></button>
        </div>
        {/* Admin Panel shortcut */}
        <button onClick={()=>{onClose();onAdminPanel();}} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"center",gap:10,background:g,border:"none",color:"#fff",fontWeight:700,padding:"12px 18px",borderRadius:14,cursor:"pointer",fontSize:15,marginBottom:22,boxShadow:"0 8px 24px rgba(249,115,22,.3)"}}>
          <Ic n="Dashboard" s={18} c="#fff"/>Open Admin Panel
        </button>
        {/* ── PHOTOS ── */}
        <div style={{marginBottom:10}}>
          <p style={{color:"#9ca3af",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>📸 Photos</p>
          <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.1)",borderRadius:14,padding:14,marginBottom:10}}>
            <label style={{color:"#d1d5db",fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>Hero Background Image</label>
            {f.heroBg&&<img src={f.heroBg} alt="hero" style={{width:"100%",height:90,objectFit:"cover",borderRadius:10,marginBottom:8}}/>}
            <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:"rgba(255,255,255,.07)",border:"1px dashed rgba(255,255,255,.2)",borderRadius:10,padding:"10px 14px",cursor:"pointer",color:"#9ca3af",fontSize:13,fontWeight:600}}>
              <Ic n="Plus" s={15} c="#9ca3af"/>{f.heroBg?"Change Image":"Upload Image"}
              <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>u({heroBg:ev.target.result});r.readAsDataURL(file);}}/>
            </label>
            {f.heroBg&&<button onClick={()=>u({heroBg:""})} style={{marginTop:6,background:"none",border:"none",color:"#f87171",fontSize:12,cursor:"pointer",width:"100%"}}>✕ Remove</button>}
          </div>
          <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.1)",borderRadius:14,padding:14}}>
            <label style={{color:"#d1d5db",fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>Gallery Photos <span style={{color:"#6b7280",fontWeight:400}}>(up to 6)</span></label>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>
              {(f.gallery||[]).map((img,i)=>(
                <div key={i} style={{position:"relative"}}>
                  <img src={img} alt="" style={{width:"100%",height:70,objectFit:"cover",borderRadius:8}}/>
                  <button onClick={()=>u({gallery:(f.gallery||[]).filter((_,j)=>j!==i)})} style={{position:"absolute",top:3,right:3,background:"rgba(0,0,0,.7)",border:"none",color:"#f87171",borderRadius:"50%",width:20,height:20,cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",padding:0}}><Ic n="X" s={10} c="#f87171"/></button>
                </div>
              ))}
              {(f.gallery||[]).length<6&&(
                <label style={{height:70,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.05)",border:"1px dashed rgba(255,255,255,.2)",borderRadius:8,cursor:"pointer",color:"#6b7280"}}>
                  <Ic n="Plus" s={20} c="#6b7280"/>
                  <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>u({gallery:[...(f.gallery||[]),ev.target.result]});r.readAsDataURL(file);}}/>
                </label>
              )}
            </div>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <p style={{color:"#9ca3af",fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginTop:4,marginBottom:2}}>🔧 Site Settings</p>
          {[["Logo Text","logoText"],["Logo Accent","logoAccent"],["Hero Title","heroTitle"],["Hero Highlight","heroHL"],["Hero Badge","heroBadge"],["Phone","phone"],["Email","email"],["Address","address"],["WhatsApp No.","wa"],["Admin PIN","pin"]].map(([l,k])=>(
            <Field key={k} label={l} value={f[k]||""} onChange={v=>u({[k]:v})}/>
          ))}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div>
              <label style={{color:"#d1d5db",fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Primary Color</label>
              <input type="color" value={f.primary} onChange={e=>u({primary:e.target.value})} style={{width:"100%",height:44,borderRadius:10,border:"1px solid rgba(255,255,255,.2)",background:"none",cursor:"pointer"}}/>
            </div>
            <div>
              <label style={{color:"#d1d5db",fontSize:13,fontWeight:600,display:"block",marginBottom:5}}>Accent Color</label>
              <input type="color" value={f.accent} onChange={e=>u({accent:e.target.value})} style={{width:"100%",height:44,borderRadius:10,border:"1px solid rgba(255,255,255,.2)",background:"none",cursor:"pointer"}}/>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[["s1v","Stat 1"],["s1l","Label 1"],["s2v","Stat 2"],["s2l","Label 2"],["s3v","Stat 3"],["s3l","Label 3"],["s4v","Stat 4"],["s4l","Label 4"]].map(([k,l])=>(
              <Field key={k} label={l} value={f[k]||""} onChange={v=>u({[k]:v})}/>
            ))}
          </div>
        </div>
        <button onClick={()=>onSave(f)} style={{width:"100%",marginTop:18,background:g,border:"none",color:"#fff",fontWeight:700,padding:13,borderRadius:12,cursor:"pointer",fontSize:15}}>
          💾 Save Changes
        </button>
      </div>
    </div>
  );
}

function Landing({setPage}){
  const [cfg,setCfg]=useState(getCfg());
  const [plans,setPlans]=useState([]);
  useEffect(()=>{
    // Load plans from Firestore on mount
    dbGetAll("igym_plans").then(p=>setPlans(p)).catch(()=>{});
    const h=async()=>{
      setCfg(getCfg());
      try{setPlans(await dbGetAll("igym_plans"));}catch(e){}
    };
    window.addEventListener("cfgChange",h);
    return()=>window.removeEventListener("cfgChange",h);
  },[]);
  const g=G(cfg),gt=GT(cfg),p=cfg.primary;
  const svcs=[
    {i:"Dumbbell",t:"Strength Training",d:"Build muscle with expert-curated strength programs tailored to your goals."},
    {i:"Flame",t:"Cardio & HIIT",d:"Burn fat fast with high-intensity interval training and cardio sessions."},
    {i:"Target",t:"Personal Training",d:"One-on-one sessions with certified trainers for maximum results."},
    {i:"Heart",t:"Nutrition Plans",d:"Custom diet plans designed by nutritionists for your body type."},
    {i:"Zap",t:"CrossFit",d:"High-performance workouts combining gymnastics and weightlifting."},
    {i:"Shield",t:"Recovery & Wellness",d:"Dedicated recovery including yoga, stretching, and massage."},

  return(

        <div style={{position:"absolute",inset:0,background:"linear-gradient(135deg,rgba(0,0,0,.93),rgba(0,0,0,.6))",zIndex:1}}/>
        <div style={{position:"absolute",inset:0,background:`radial-gradient(ellipse at 20% 50%,${p}18,transparent 60%)`,zIndex:1}}/>
        <div style={{position:"relative",zIndex:2,maxWidth:860,padding:"0 24px",textAlign:"center"}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,background:`${p}20`,border:`1px solid ${p}40`,borderRadius:100,padding:"6px 18px",marginBottom:24}}>
            <Ic n="Flame" s={14} c={p}/><span style={{color:p,fontSize:13,fontWeight:700}}>{cfg.heroBadge}</span>
          </div>
          <h1 style={{fontSize:"clamp(48px,8vw,84px)",fontWeight:900,lineHeight:1.05,marginBottom:18,letterSpacing:"-2px"}}>
            {cfg.heroTitle}<br/><span style={gt}>{cfg.heroHL}</span>
          </h1>
          <p style={{color:"#9ca3af",fontSize:18,lineHeight:1.65,maxWidth:620,margin:"0 auto 34px"}}>{cfg.heroSub}</p>
          <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap",marginBottom:52}}>
            <button onClick={()=>setPage("login")} style={{background:g,border:"none",color:"#fff",fontWeight:700,padding:"14px 28px",borderRadius:14,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",gap:8,boxShadow:`0 12px 40px ${p}40`}}>
              <Ic n="Dumbbell" s={18} c="#fff"/>Member Login<Ic n="Arrow" s={16} c="#fff"/>
            </button>
            <a href="#plans" style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",color:"#fff",fontWeight:700,padding:"14px 28px",borderRadius:14,textDecoration:"none",fontSize:16,display:"flex",alignItems:"center",gap:8}}>
              <Ic n="Play" s={16} c="#fff"/>View Plans
            </a>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:24,maxWidth:580,margin:"0 auto"}}>
            {[[cfg.s1v,cfg.s1l],[cfg.s2v,cfg.s2l],[cfg.s3v,cfg.s3l],[cfg.s4v,cfg.s4l]].map(([v,l])=>(
              <div key={l}><div style={{fontSize:28,fontWeight:900,color:p}}>{v}</div><div style={{color:"#6b7280",fontSize:13,marginTop:2}}>{l}</div></div>
            ))}
          </div>
        </div>
      </section>

      {/* SERVICES */}
      <section id="services" style={{padding:"80px 24px",background:"#09090b"}}>
        <div style={{maxWidth:1100,margin:"0 auto"}}>
          <div style={{textAlign:"center",marginBottom:52}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:8,background:`${p}20`,border:`1px solid ${p}40`,borderRadius:100,padding:"6px 18px",marginBottom:16}}>
              <Ic n="Zap" s={14} c={p}/><span style={{color:p,fontSize:13,fontWeight:700}}>Our Services</span>
            </div>
            <h2 style={{fontSize:"clamp(32px,5vw,48px)",fontWeight:900}}>Everything You Need to <span style={gt}>Succeed</span></h2>

              <div key={s.t} style={{background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:20,padding:24,transition:"all .2s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(255,255,255,.25)";e.currentTarget.style.transform="translateY(-3px)";}}

                <div style={{width:48,height:48,borderRadius:14,background:g,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:14}}><Ic n={s.i} s={22} c="#fff"/></div>
                <h3 style={{color:"#fff",fontWeight:700,fontSize:17,marginBottom:8}}>{s.t}</h3>
                <p style={{color:"#6b7280",fontSize:14,lineHeight:1.6}}>{s.d}</p>

      {(cfg.gallery||[]).length>0&&(
        <section style={{padding:"80px 24px",background:"#000"}}>
          <div style={{maxWidth:1100,margin:"0 auto"}}>
            <div style={{textAlign:"center",marginBottom:40}}>
              <div style={{display:"inline-flex",alignItems:"center",gap:8,background:`${p}20`,border:`1px solid ${p}40`,borderRadius:100,padding:"6px 18px",marginBottom:14}}>
                <Ic n="Heart" s={14} c={p}/><span style={{color:p,fontSize:13,fontWeight:700}}>Gallery</span>
              </div>
              <h2 style={{fontSize:"clamp(28px,4vw,42px)",fontWeight:900}}>Our <span style={gt}>Facility</span></h2>

            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:16}}>
              {(cfg.gallery||[]).map((img,i)=>(
                <div key={i} style={{borderRadius:18,overflow:"hidden",aspectRatio:"4/3"}}>
                  <img src={img} alt={`Gallery ${i+1}`} style={{width:"100%",height:"100%",objectFit:"cover",transition:"transform .3s"}}
                    onMouseEnter={e=>e.currentTarget.style.transform="scale(1.05)"}
                    onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}/>
                </div>
              ))}
            </div>
          </div>
        </section>
      )}

      {/* PLANS */}

        <div style={{maxWidth:1100,margin:"0 auto"}}>
          <div style={{textAlign:"center",marginBottom:52}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:8,background:`${p}20`,border:`1px solid ${p}40`,borderRadius:100,padding:"6px 18px",marginBottom:16}}>
              <Ic n="Flame" s={14} c={p}/><span style={{color:p,fontSize:13,fontWeight:700}}>Membership Plans</span>
            </div>
            <h2 style={{fontSize:"clamp(32px,5vw,48px)",fontWeight:900}}>Choose Your <span style={gt}>Plan</span></h2>

                onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>
                {pl.badge&&<div style={{position:"absolute",top:-13,left:"50%",transform:"translateX(-50%)",background:g,color:"#fff",fontSize:11,fontWeight:700,padding:"4px 14px",borderRadius:100,whiteSpace:"nowrap"}}>{pl.badge}</div>}
                <h3 style={{color:"#fff",fontWeight:900,fontSize:22,marginBottom:4}}>{pl.name}</h3>
                {pl.desc&&<p style={{color:"#6b7280",fontSize:13,marginBottom:14}}>{pl.desc}</p>}
                <div style={{display:"flex",alignItems:"baseline",gap:4,marginBottom:20}}>
                  <span style={{fontSize:36,fontWeight:900,color:p}}>₹{pl.price.toLocaleString("en-IN")}</span>
                  <span style={{color:"#6b7280",fontSize:14}}>/month</span>
                </div>
                <div style={{marginBottom:22}}>{(pl.features||[]).map(f=>(

//  LOGIN PAGE
// ══════════════════════════════════════════════════════════════
function LoginPage({setPage,toast}){
  const [id,setId]=useState("");
  const [pw,setPw]=useState("");
  const [showPw,setShowPw]=useState(false);
  const [loading,setLoading]=useState(false);
  const cfg=getCfg(),g=G(cfg),p=cfg.primary;

  const doLogin=async e=>{
    e.preventDefault();
    if(!id.trim()||!pw.trim()){toast("Fill in all fields","error");return;}
    setLoading(true);
    try{
      const members=await dbGetAll("igym_members");
      const user=members.find(u=>u.member_id?.toLowerCase()===id.trim().toLowerCase()||u.email?.toLowerCase()===id.trim().toLowerCase());
      if(!user){toast("Member not found","error");setLoading(false);return;}
      if(user.role==="admin"){toast("Admin access is restricted","error");setLoading(false);return;}
      const ok=await chkPw(pw,user.password_hash);
      if(!ok){toast("Wrong password","error");setLoading(false);return;}
      const tok=mkTok({id:user.id,member_id:user.member_id,name:user.name,role:user.role});
      setSess(tok,{id:user.id,member_id:user.member_id,name:user.name,role:user.role});
      toast("Welcome back, "+user.name.split(" ")[0]+"! 🎉","success");
      setTimeout(()=>setPage("dashboard"),600);
    }catch(err){toast("Login error: "+err.message,"error");}
    setLoading(false);
  };

  return(
    <div style={{minHeight:"100vh",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",padding:"80px 16px 24px"}}>
      <div style={{width:"100%",maxWidth:420}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{width:64,height:64,borderRadius:18,background:g,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}><Ic n="Infinity" s={30} c="#fff"/></div>
          <h1 style={{color:"#fff",fontWeight:900,fontSize:26,marginBottom:4}}>{cfg.logoText}<span style={{color:p}}>{cfg.logoAccent}</span></h1>
          <p style={{color:"#6b7280",fontSize:14}}>Member Portal</p>
        </div>
        <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.1)",borderRadius:22,padding:26}}>
          <form onSubmit={doLogin}>
            <div style={{marginBottom:14}}><Field label="Member ID or Email" value={id} onChange={setId} placeholder="GYM001 or email@example.com"/></div>
            <div style={{marginBottom:20,position:"relative"}}>
              <Field label="Password" value={pw} onChange={setPw} type={showPw?"text":"password"} placeholder="Enter password"/>
              <button type="button" onClick={()=>setShowPw(!showPw)} style={{position:"absolute",right:12,bottom:10,background:"none",border:"none",color:"#6b7280",cursor:"pointer",display:"flex"}}>
                <Ic n={showPw?"EyeOff":"Eye"} s={17}/>
              </button>
            </div>
            <button type="submit" disabled={loading} style={{width:"100%",background:g,border:"none",color:"#fff",fontWeight:700,padding:13,borderRadius:13,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {loading?<Spin s={20} c="#fff"/>:<><Ic n="Dumbbell" s={18} c="#fff"/>Login</>}
            </button>
          </form>
          <div style={{marginTop:18,padding:14,background:"#09090b",borderRadius:12}}>
            <p style={{color:"#6b7280",fontSize:12,fontWeight:700,marginBottom:6}}>Demo Credentials:</p>
            <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:"4px 10px",alignItems:"center"}}>
              <span style={{color:"#60a5fa",fontSize:12,fontWeight:700}}>Member:</span><span style={{color:"#d1d5db",fontSize:12}}>GYM001 / member123</span>
            </div>
          </div>
        </div>
        <button onClick={()=>setPage("landing")} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:"#6b7280",cursor:"pointer",margin:"14px auto 0",fontSize:14}}>
          <Ic n="ChevL" s={16}/>Back to Home
        </button>
      </div>
    </div>
  );
}

//  MEMBER DASHBOARD
// ══════════════════════════════════════════════════════════════
function MemberDash({setPage,toast}){
  const user=getSess();
  const cfg=getCfg(),g=G(cfg),p=cfg.primary;
  const [tab,setTab]=useState("today");
  const [date,setDate]=useState(today());
  const [diet,setDiet]=useState(null);
  const [workout,setWorkout]=useState(null);

  useEffect(()=>{if(!user){setPage("login");return;}load();},[date]);
  const load=async()=>{
    try{
      const diets=await dbGetWhere("igym_diet","member_id","==",user.id);
      setDiet(diets.find(d=>d.date===date)||null);
      const workouts=await dbGetWhere("igym_workout","member_id","==",user.id);
      setWorkout(workouts.find(w=>w.date===date)||null);
    }catch(e){console.warn("MemberDash load error",e);}
  };

  const mI={breakfast:"Coffee",lunch:"Sun",dinner:"Moon",snacks:"Apple"};

  return(

            <p style={{color:"#6b7280",fontSize:13}}>{user?.member_id} · {user?.role}</p>
          </div>
          <button onClick={()=>{clrSess();setPage("landing");}} style={{display:"flex",alignItems:"center",gap:6,background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.2)",color:"#f87171",padding:"8px 14px",borderRadius:10,cursor:"pointer",fontSize:13,fontWeight:600}}>
            <Ic n="LogOut" s={15}/>Logout

        </div>

        <div style={{display:"flex",alignItems:"center",gap:4,background:"#18181b",border:"1px solid rgba(255,255,255,.1)",borderRadius:13,padding:"5px 12px",marginBottom:8,width:"fit-content"}}>
          <button onClick={()=>setDate(addDays(date,-1))} style={{background:"none",border:"none",color:"#9ca3af",cursor:"pointer",display:"flex"}}><Ic n="ChevL" s={18}/></button>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{background:"none",border:"none",color:"#fff",fontSize:14,fontWeight:600,outline:"none",cursor:"pointer"}}/>
          <button onClick={()=>setDate(addDays(date,1))} style={{background:"none",border:"none",color:"#9ca3af",cursor:"pointer",display:"flex"}}><Ic n="ChevR" s={18}/></button>
        </div>
        <p style={{color:"#6b7280",fontSize:13,marginBottom:20}}>{fmtDate(date)}</p>

        <div style={{display:"flex",gap:8,marginBottom:22,flexWrap:"wrap"}}>
          {[["today","📋 Today"],["diet","🥗 Diet"],["workout","💪 Workout"]].map(([t,l])=>(
            <button key={t} onClick={()=>setTab(t)} style={{padding:"8px 16px",borderRadius:10,border:"none",fontWeight:600,fontSize:13,cursor:"pointer",background:tab===t?g:"rgba(255,255,255,.06)",color:tab===t?"#fff":"#9ca3af"}}>{l}</button>
          ))}
        </div>

        {tab==="today"&&(
          <div style={{display:"grid",gap:16}}>
            {/* diet summary */}
            <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:20,padding:20}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
                <h3 style={{color:"#fff",fontWeight:700,display:"flex",alignItems:"center",gap:8}}><Ic n="Utensils" s={18} c={p}/>Today's Diet</h3>
                {diet?<span style={{color:"#4ade80",fontSize:12,background:"rgba(74,222,128,.12)",padding:"3px 10px",borderRadius:100}}>✓ Assigned</span>:<span style={{color:"#fb923c",fontSize:12,background:"rgba(251,146,60,.12)",padding:"3px 10px",borderRadius:100}}>Not assigned</span>}
              </div>
              {diet?(
                <>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    {["breakfast","lunch","dinner","snacks"].map(m=>diet[m]&&(
                      <div key={m} style={{background:"#09090b",borderRadius:14,padding:14}}>
                        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><Ic n={mI[m]} s={14} c={mC[m]}/><span style={{color:"#9ca3af",fontSize:12,textTransform:"capitalize",fontWeight:600}}>{m}</span></div>
                        <p style={{color:"#fff",fontSize:14,fontWeight:600,marginBottom:diet[m].cal?4:0}}>{diet[m].name}</p>

            </div>
            {/* workout summary */}
            <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:20,padding:20}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
                <h3 style={{color:"#fff",fontWeight:700,display:"flex",alignItems:"center",gap:8}}><Ic n="Dumbbell" s={18} c={p}/>Today's Workout</h3>

                    {workout.type&&<span style={{background:p+"20",color:p,padding:"4px 14px",borderRadius:100,fontSize:13,fontWeight:600}}>{workout.type}</span>}
                    {workout.duration&&<span style={{background:"rgba(255,255,255,.08)",color:"#d1d5db",padding:"4px 14px",borderRadius:100,fontSize:13}}>⏱ {workout.duration}</span>}
                  </div>
                  {(workout.exercises||[]).map((ex,i)=>(
                    <div key={i} style={{background:"#09090b",borderRadius:12,padding:"11px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                      <div><span style={{color:"#fff",fontWeight:600,fontSize:14}}>{ex.name}</span>{ex.muscle&&<span style={{color:"#6b7280",fontSize:12,marginLeft:8}}>{ex.muscle}</span>}</div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{color:p,fontSize:13,fontWeight:600}}>{ex.sets}×{ex.reps}{ex.weight?" · "+ex.weight:""}</span>

                  ))}

              ):<p style={{color:"#4b5563",textAlign:"center",padding:"28px 0"}}>Your trainer hasn't assigned a workout plan for today yet.</p>}
            </div>
          </div>
        )}

        {tab==="diet"&&(
          <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:20,padding:20}}>
            <h3 style={{color:"#fff",fontWeight:700,marginBottom:16}}>Diet Plan — {fmtDate(date)}</h3>
            {diet?(
              <>
                {["breakfast","lunch","dinner","snacks"].map(m=>diet[m]&&(
                  <div key={m} style={{background:"#09090b",borderRadius:16,padding:16,marginBottom:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                      <Ic n={mI[m]} s={16} c={mC[m]}/><span style={{color:"#fff",fontWeight:700,textTransform:"capitalize"}}>{m}</span>
                      {diet[m].cal>0&&<span style={{marginLeft:"auto",color:mC[m],fontWeight:700,fontSize:13}}>{diet[m].cal} kcal</span>}
                    </div>
                    <p style={{color:"#d1d5db",fontSize:15,fontWeight:600,marginBottom:8}}>{diet[m].name}</p>
                    <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>

                      {diet[m].carbs>0&&<span style={{color:"#4ade80",fontSize:12,fontWeight:600}}>Carbs: {diet[m].carbs}g</span>}

                ))}
                {diet.notes&&<div style={{padding:"12px 16px",background:p+"10",borderRadius:12,borderLeft:"3px solid "+p}}><p style={{color:"#d1d5db",fontSize:13}}>📋 {diet.notes}</p></div>}
              </>
            ):<p style={{color:"#4b5563",textAlign:"center",padding:"40px 0"}}>No diet plan for this date.</p>}
          </div>
        )}

        {tab==="workout"&&(
          <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:20,padding:20}}>
            <h3 style={{color:"#fff",fontWeight:700,marginBottom:16}}>Workout Plan — {fmtDate(date)}</h3>

                    <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                      {ex.weight&&<span style={{color:"#9ca3af",fontSize:12}}>⚖️ {ex.weight}</span>}
                      {ex.muscle&&<span style={{color:"#9ca3af",fontSize:12}}>💪 {ex.muscle}</span>}

        )}
      </div>
    </div>
  );
}

//  ADMIN DASHBOARD
// ══════════════════════════════════════════════════════════════
function AdminDash({setPage,toast}){
  const user=getSess();
  const cfg=getCfg(),g=G(cfg),p=cfg.primary;
  const [tab,setTab]=useState("overview");
  const [members,setMembers]=useState([]);
  const [plans,setPlans]=useState([]);

  useEffect(()=>{
    if(!user||user.role!=="admin"){setPage("login");return;}
    reload();
  },[]);

  const reload=async()=>{
    try{
      const all=await dbGetAll("igym_members");
      setMembers(all.filter(u=>u.role!=="admin"));
      setPlans(await dbGetAll("igym_plans"));
    }catch(e){console.warn("AdminDash reload error",e);}
  };

  const navItems=[
    {id:"overview",n:"Dashboard",i:"Dashboard"},
    {id:"members",n:"Members",i:"Users"},
    {id:"diet",n:"Diet Plans",i:"Utensils"},
    {id:"workout",n:"Workout Plans",i:"Dumbbell"},

              <Ic n={n.i} s={18} c={tab===n.id?p:"#6b7280"}/>{n.n}

        </nav>
        <button onClick={()=>{clrSess();setPage("landing");}}
          style={{display:"flex",alignItems:"center",gap:8,background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.2)",color:"#f87171",padding:"10px 14px",borderRadius:12,cursor:"pointer",fontSize:14,fontWeight:600}}>

      <main style={{flex:1,marginLeft:230,padding:24,minHeight:"calc(100vh - 64px)",overflowY:"auto"}}>
        {tab==="overview"&&<AdminOverview members={members} plans={plans} g={g} p={p}/>}
        {tab==="members"&&<MembersTab members={members} plans={plans} g={g} p={p} toast={toast} reload={reload}/>}
        {tab==="diet"&&<DietTab members={members} g={g} p={p} toast={toast}/>}
        {tab==="workout"&&<WorkoutTab members={members} g={g} p={p} toast={toast}/>}
        {tab==="plans"&&<PlansTab plans={plans} g={g} p={p} toast={toast} reload={reload}/>}
      </main>
    </div>
  );
}

function AdminOverview({members,plans,g,p}){
  const stats=[
    {i:"Users",l:"Total Members",v:members.length,c:p},
    {i:"Activity",l:"Active",v:members.filter(m=>m.status==="active").length,c:"#22c55e"},
    {i:"CreditCard",l:"Plans",v:plans.length,c:"#8b5cf6"},
    {i:"Award",l:"Est. Revenue",v:"₹"+(members.length*1999).toLocaleString("en-IN"),c:"#f59e0b"},
  ];
  return(
    <div>
      <h2 style={{color:"#fff",fontWeight:900,fontSize:22,marginBottom:20}}>Dashboard Overview</h2>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:16,marginBottom:24}}>
        {stats.map(s=>(
          <div key={s.l} style={{background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:18,padding:20}}>
            <div style={{width:44,height:44,borderRadius:12,background:s.c+"20",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12}}><Ic n={s.i} s={22} c={s.c}/></div>
            <div style={{color:"#fff",fontSize:28,fontWeight:900}}>{s.v}</div>
            <div style={{color:"#6b7280",fontSize:13,marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:18,padding:20}}>
        <h3 style={{color:"#fff",fontWeight:700,marginBottom:14}}>Recent Members</h3>
        {members.length===0?<p style={{color:"#4b5563",textAlign:"center",padding:28}}>No members yet.</p>:
          members.slice(0,6).map(m=>(
            <div key={m.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
              <div style={{width:38,height:38,borderRadius:"50%",background:g,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,flexShrink:0}}>{m.name?.[0]}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{color:"#fff",fontWeight:600,fontSize:14}}>{m.name}</div>
                <div style={{color:"#6b7280",fontSize:12}}>{m.member_id} · {m.plan||"No Plan"}</div>
              </div>
              <span style={{fontSize:11,padding:"3px 9px",borderRadius:100,background:m.status==="active"?"rgba(34,197,94,.15)":"rgba(239,68,68,.15)",color:m.status==="active"?"#4ade80":"#f87171"}}>{m.status||"active"}</span>
            </div>
          ))
        }
      </div>
    </div>
  );
}

function MembersTab({members,plans,g,p,toast,reload}){
  const [q,setQ]=useState("");
  const [modal,setModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [view,setView]=useState(null);
  const [fm,setFm]=useState({});
  const [saving,setSaving]=useState(false);
  const up=v=>setFm(f=>({...f,...v}));
  const list=members.filter(m=>m.name?.toLowerCase().includes(q.toLowerCase())||m.member_id?.toLowerCase().includes(q.toLowerCase())||m.email?.toLowerCase().includes(q.toLowerCase()));

  const openCreate=()=>{setEditing(null);setFm({status:"active"});setModal(true);};
  const openEdit=m=>{setEditing(m);setFm({...m,password:""});setModal(true);};
  const doDelete=async(id,name)=>{
    if(!confirm("Delete "+name+"?"))return;
    try{await dbDelete("igym_members",id);toast("Member deleted","success");reload();}
    catch(e){toast("Delete failed: "+e.message,"error");}
  };
  const doSave=async e=>{
    e.preventDefault();
    if(!fm.name?.trim()||!fm.email?.trim()){toast("Name & email required","error");return;}
    if(!editing&&!fm.password?.trim()){toast("Password required","error");return;}
    setSaving(true);
    try{
      if(editing){
        const upd={name:fm.name,email:fm.email,phone:fm.phone||"",age:fm.age||"",weight:fm.weight||"",height:fm.height||"",goal:fm.goal||"",plan:fm.plan||"",status:fm.status};
        if(fm.password)upd.password_hash=await hashPw(fm.password);
        await dbSet("igym_members",editing.id,upd);
        toast("Member updated!","success");
      }else{
        const all=await dbGetAll("igym_members");
        const na=all.filter(u=>u.role!=="admin");
        const mid="GYM"+String(na.length+1).padStart(3,"0");
        const newId="m"+Date.now();
        await dbSet("igym_members",newId,{member_id:mid,name:fm.name,email:fm.email,phone:fm.phone||"",age:fm.age||"",weight:fm.weight||"",height:fm.height||"",goal:fm.goal||"",plan:fm.plan||"",status:fm.status||"active",role:"member",password_hash:await hashPw(fm.password)});
        toast("Member created! ID: "+mid,"success");
      }
      setModal(false);reload();
    }catch(err){toast("Save failed: "+err.message,"error");}
    setSaving(false);
  };

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div>
          <h2 style={{color:"#fff",fontWeight:900,fontSize:22}}>Members</h2>
          <p style={{color:"#6b7280",fontSize:13,marginTop:3}}>{list.length} member{list.length!==1?"s":""}</p>
        </div>
        <button onClick={openCreate} style={{background:g,border:"none",color:"#fff",fontWeight:700,padding:"10px 18px",borderRadius:12,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",gap:6}}>
          <Ic n="Plus" s={16} c="#fff"/>Add Member
        </button>
      </div>
      <div style={{position:"relative",marginBottom:14}}>
        <div style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)"}}><Ic n="Search" s={16} c="#6b7280"/></div>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search by name, ID or email…"
          style={{width:"100%",background:"#18181b",border:"1px solid rgba(255,255,255,.1)",borderRadius:12,padding:"10px 14px 10px 40px",color:"#fff",fontSize:14,outline:"none"}}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {list.length===0?(
          <div style={{textAlign:"center",padding:52,background:"#18181b",borderRadius:18}}>
            <Ic n="Users" s={44} c="#374151"/>
            <p style={{color:"#4b5563",marginTop:14}}>No members found.</p>
          </div>
        ):list.map(m=>(
          <div key={m.id} style={{background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:16,padding:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <div style={{width:44,height:44,borderRadius:"50%",background:g,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:16,flexShrink:0}}>{m.name?.[0]}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:3}}>
                <span style={{color:"#fff",fontWeight:700,fontSize:15}}>{m.name}</span>
                <span style={{background:p+"20",color:p,fontSize:11,padding:"2px 8px",borderRadius:100,fontWeight:700}}>{m.member_id}</span>
                <span style={{background:m.status==="active"?"rgba(34,197,94,.15)":"rgba(239,68,68,.15)",color:m.status==="active"?"#4ade80":"#f87171",fontSize:11,padding:"2px 8px",borderRadius:100}}>{m.status||"active"}</span>
              </div>
              <div style={{color:"#6b7280",fontSize:13}}>{m.email}{m.plan?" · "+m.plan+" Plan":""}</div>
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              <button onClick={()=>setView(m)} style={{padding:"7px 8px",background:"rgba(96,165,250,.1)",border:"1px solid rgba(96,165,250,.2)",color:"#60a5fa",borderRadius:8,cursor:"pointer",display:"flex"}}><Ic n="Eye" s={14}/></button>
              <button onClick={()=>openEdit(m)} style={{padding:"7px 8px",background:p+"15",border:"1px solid "+p+"30",color:p,borderRadius:8,cursor:"pointer",display:"flex"}}><Ic n="Edit" s={14}/></button>
              <button onClick={()=>doDelete(m.id,m.name)} style={{padding:"7px 8px",background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.2)",color:"#f87171",borderRadius:8,cursor:"pointer",display:"flex"}}><Ic n="Trash" s={14}/></button>
            </div>
          </div>
        ))}
      </div>

      {modal&&(
        <Modal title={editing?"Edit — "+editing.name:"Add New Member"} onClose={()=>setModal(false)} wide>
          <form onSubmit={doSave}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
              <Field label="Full Name *" value={fm.name||""} onChange={v=>up({name:v})} placeholder="Rahul Sharma"/>
              <Field label="Email *" value={fm.email||""} onChange={v=>up({email:v})} placeholder="rahul@example.com"/>
              <Field label={editing?"New Password (blank=keep)":"Password *"} value={fm.password||""} onChange={v=>up({password:v})} type="password" placeholder="Min 6 chars"/>
              <Field label="Phone" value={fm.phone||""} onChange={v=>up({phone:v})} placeholder="+91 98765 43210"/>
              <Field label="Age" value={fm.age?.toString()||""} onChange={v=>up({age:parseInt(v)||""})} type="number" placeholder="25"/>
              <Field label="Weight (kg)" value={fm.weight?.toString()||""} onChange={v=>up({weight:v})} type="number" placeholder="70"/>
              <Field label="Height (cm)" value={fm.height?.toString()||""} onChange={v=>up({height:v})} type="number" placeholder="175"/>
              <div>
                <label style={{display:"block",color:"#d1d5db",fontSize:13,fontWeight:600,marginBottom:5}}>Fitness Goal</label>
                <select value={fm.goal||""} onChange={e=>up({goal:e.target.value})} style={{width:"100%",background:"#27272a",border:"1px solid rgba(255,255,255,.12)",borderRadius:10,padding:"9px 13px",color:"#fff",fontSize:14,outline:"none"}}>
                  <option value="">Select goal</option>
                  {["Weight Loss","Muscle Gain","Endurance","General Fitness","Flexibility","Athletic Performance"].map(g=><option key={g}>{g}</option>)}
                </select>
              </div>
              <div>
                <label style={{display:"block",color:"#d1d5db",fontSize:13,fontWeight:600,marginBottom:5}}>Membership Plan</label>
                <select value={fm.plan||""} onChange={e=>up({plan:e.target.value})} style={{width:"100%",background:"#27272a",border:"1px solid rgba(255,255,255,.12)",borderRadius:10,padding:"9px 13px",color:"#fff",fontSize:14,outline:"none"}}>
                  <option value="">No Plan</option>
                  {plans.map(pl=><option key={pl.id} value={pl.name}>{pl.name} — ₹{pl.price}</option>)}
                </select>
              </div>
              <div>
                <label style={{display:"block",color:"#d1d5db",fontSize:13,fontWeight:600,marginBottom:5}}>Status</label>
                <select value={fm.status||"active"} onChange={e=>up({status:e.target.value})} style={{width:"100%",background:"#27272a",border:"1px solid rgba(255,255,255,.12)",borderRadius:10,padding:"9px 13px",color:"#fff",fontSize:14,outline:"none"}}>
                  <option value="active">Active</option><option value="inactive">Inactive</option>
                </select>
              </div>
            </div>
            <div style={{display:"flex",gap:10}}>
              <button type="button" onClick={()=>setModal(false)} style={{flex:1,padding:12,background:"#27272a",border:"none",color:"#d1d5db",borderRadius:12,cursor:"pointer",fontWeight:600}}>Cancel</button>
              <button type="submit" disabled={saving} style={{flex:1,padding:12,background:g,border:"none",color:"#fff",borderRadius:12,cursor:"pointer",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                {saving?<Spin s={18} c="#fff"/>:<><Ic n="Save" s={16} c="#fff"/>{editing?"Update":"Create Member"}</>}
              </button>
            </div>
          </form>
        </Modal>
      )}

      {view&&(
        <Modal title="Member Details" onClose={()=>setView(null)}>
          <div style={{textAlign:"center",marginBottom:18}}>
            <div style={{width:70,height:70,borderRadius:"50%",background:g,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:900,fontSize:28,margin:"0 auto 10px"}}>{view.name?.[0]}</div>
            <h3 style={{color:"#fff",fontWeight:800,fontSize:20}}>{view.name}</h3>
            <p style={{color:p,fontSize:14,fontWeight:700,fontFamily:"monospace"}}>{view.member_id}</p>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[["Email",view.email],["Phone",view.phone||"N/A"],["Age",view.age?view.age+" yrs":"N/A"],["Weight",view.weight?view.weight+" kg":"N/A"],["Height",view.height?view.height+" cm":"N/A"],["Goal",view.goal||"N/A"],["Plan",view.plan||"N/A"],["Status",view.status||"active"]].map(([l,v])=>(
              <div key={l} style={{background:"#27272a",borderRadius:12,padding:12}}>
                <div style={{color:"#6b7280",fontSize:11,marginBottom:4}}>{l}</div>
                <div style={{color:"#fff",fontSize:13,fontWeight:600,wordBreak:"break-all"}}>{v}</div>
              </div>
            ))}
          </div>
        </Modal>
      )}
    </div>
  );
}

function DietTab({members,g,p,toast}){
  const [mid,setMid]=useState("");
  const [date,setDate]=useState(today());
  const [plan,setPlan]=useState(emptyD());
  const [saving,setSaving]=useState(false);
  const [has,setHas]=useState(false);

  function emptyD(){
    return{breakfast:{name:"",cal:0,protein:0,carbs:0,fat:0,notes:""},lunch:{name:"",cal:0,protein:0,carbs:0,fat:0,notes:""},dinner:{name:"",cal:0,protein:0,carbs:0,fat:0,notes:""},snacks:{name:"",cal:0,protein:0,carbs:0,fat:0,notes:""},notes:""};
  }

  useEffect(()=>{
    if(!mid)return;
    (async()=>{
      try{
        const recs=await dbGetWhere("igym_diet","member_id","==",mid);
        const f=recs.find(d=>d.date===date);
        if(f){setPlan(f);setHas(true);}else{setPlan(emptyD());setHas(false);}
      }catch(e){console.warn(e);setPlan(emptyD());setHas(false);}
    })();
  },[mid,date]);

  const upM=(m,f,v)=>setPlan(prev=>({...prev,[m]:{...prev[m],[f]:v}}));
  const tc=["breakfast","lunch","dinner","snacks"].reduce((s,m)=>s+(parseInt(plan[m]?.cal)||0),0);
  const mem=members.find(m=>m.id===mid);

  const doSave=async()=>{
    if(!mid){toast("Select a member","error");return;}
    setSaving(true);
    try{
      const recs=await dbGetWhere("igym_diet","member_id","==",mid);
      const existing=recs.find(d=>d.date===date);
      const docId=existing?.id||"dp"+Date.now();
      await dbSet("igym_diet",docId,{...plan,member_id:mid,date,total_cal:tc});
      toast("Diet plan "+(has?"updated":"created")+" for "+mem?.name+"!","success");
      setHas(true);
    }catch(err){toast("Save failed: "+err.message,"error");}
    setSaving(false);
  };

  const meals=[{k:"breakfast",l:"Breakfast",n:"Coffee",c:"#eab308"},{k:"lunch",l:"Lunch",n:"Sun",c:p},{k:"dinner",l:"Dinner",n:"Moon",c:"#60a5fa"},{k:"snacks",l:"Snacks",n:"Apple",c:"#4ade80"}];

  return(
    <div>
      <h2 style={{color:"#fff",fontWeight:900,fontSize:22,marginBottom:4}}>Diet Plans</h2>
      <p style={{color:"#6b7280",fontSize:13,marginBottom:20}}>Assign daily meal plans to members</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:18}}>
        <div>
          <label style={{color:"#d1d5db",fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>👤 Select Member *</label>
          <select value={mid} onChange={e=>setMid(e.target.value)} style={{width:"100%",background:"#18181b",border:"1px solid rgba(255,255,255,.12)",borderRadius:12,padding:"10px 13px",color:"#fff",fontSize:14,outline:"none"}}>
            <option value="">— Choose a member —</option>
            {members.map(m=><option key={m.id} value={m.id}>{m.name} ({m.member_id})</option>)}
          </select>
        </div>
        <div>
          <label style={{color:"#d1d5db",fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>📅 Select Date *</label>
          <div style={{display:"flex",alignItems:"center",gap:4,background:"#18181b",border:"1px solid rgba(255,255,255,.12)",borderRadius:12,padding:"3px 10px"}}>
            <button onClick={()=>setDate(addDays(date,-1))} style={{background:"none",border:"none",color:"#9ca3af",cursor:"pointer",display:"flex"}}><Ic n="ChevL" s={18}/></button>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{flex:1,background:"none",border:"none",color:"#fff",fontSize:14,outline:"none",padding:"7px 4px"}}/>
            <button onClick={()=>setDate(addDays(date,1))} style={{background:"none",border:"none",color:"#9ca3af",cursor:"pointer",display:"flex"}}><Ic n="ChevR" s={18}/></button>
          </div>
        </div>
      </div>
      {!mid?(
        <div style={{textAlign:"center",padding:52,background:"#18181b",borderRadius:20,border:"2px dashed rgba(255,255,255,.1)"}}>
          <Ic n="Utensils" s={44} c="#374151"/>
          <p style={{color:"#4b5563",marginTop:12}}>Select a member to assign their diet plan</p>
        </div>
      ):(
        <>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:16,padding:"12px 18px",marginBottom:14,flexWrap:"wrap",gap:10}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:40,height:40,borderRadius:"50%",background:g,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,flexShrink:0}}>{mem?.name?.[0]}</div>
              <div>
                <div style={{color:"#fff",fontWeight:700}}>{mem?.name}</div>
                <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{color:p,fontSize:12,fontFamily:"monospace"}}>{mem?.member_id}</span>
                  {has?<span style={{color:"#4ade80",fontSize:11}}>✓ Plan exists</span>:<span style={{color:"#fb923c",fontSize:11}}>⚠ No plan yet</span>}
                </div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {tc>0&&<div style={{padding:"5px 12px",background:p+"15",borderRadius:10,textAlign:"center"}}><div style={{color:"#6b7280",fontSize:10}}>Total</div><div style={{color:p,fontWeight:700,fontSize:14}}>{tc} kcal</div></div>}
              <button onClick={doSave} disabled={saving} style={{background:g,border:"none",color:"#fff",fontWeight:700,padding:"9px 18px",borderRadius:12,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",gap:6}}>
                {saving?<Spin s={16} c="#fff"/>:<><Ic n="Save" s={16} c="#fff"/>Save</>}
              </button>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:12,marginBottom:12}}>
            {meals.map(({k,l,n,c})=>(
              <div key={k} style={{background:c+"10",border:"1px solid "+c+"22",borderRadius:18,padding:16}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                  <div style={{width:32,height:32,background:"rgba(0,0,0,.3)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center"}}><Ic n={n} s={15} c={c}/></div>
                  <span style={{color:"#fff",fontWeight:700}}>{l}</span>
                  {plan[k]?.cal>0&&<span style={{marginLeft:"auto",color:c,fontSize:12,fontWeight:700}}>{plan[k].cal} kcal</span>}
                </div>
                <input value={plan[k]?.name||""} onChange={e=>upM(k,"name",e.target.value)}
                  placeholder={"e.g. "+(k==="breakfast"?"Oats with Banana":k==="lunch"?"Grilled Chicken & Rice":k==="dinner"?"Paneer Tikka & Roti":"Greek Yogurt")}
                  style={{width:"100%",background:"rgba(0,0,0,.3)",border:"1px solid rgba(255,255,255,.1)",borderRadius:10,padding:"8px 12px",color:"#fff",fontSize:14,outline:"none",marginBottom:8}}/>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginBottom:8}}>
                  {[["cal","Kcal"],["protein","Protein"],["carbs","Carbs"],["fat","Fat"]].map(([f,lb])=>(
                    <div key={f}>
                      <div style={{color:"#6b7280",fontSize:10,marginBottom:3}}>{lb}</div>
                      <input type="number" min="0" value={plan[k]?.[f]||""} onChange={e=>upM(k,f,parseInt(e.target.value)||0)} placeholder="0"
                        style={{width:"100%",background:"rgba(0,0,0,.3)",border:"1px solid rgba(255,255,255,.1)",borderRadius:8,padding:"6px 7px",color:"#fff",fontSize:12,outline:"none"}}/>
                    </div>
                  ))}
                </div>
                <input value={plan[k]?.notes||""} onChange={e=>upM(k,"notes",e.target.value)} placeholder="Notes / instructions…"
                  style={{width:"100%",background:"rgba(0,0,0,.3)",border:"1px solid rgba(255,255,255,.1)",borderRadius:10,padding:"8px 12px",color:"#fff",fontSize:13,outline:"none"}}/>
              </div>
            ))}
          </div>

          <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.08)",borderRadius:14,padding:16,marginBottom:14}}>
            <label style={{color:"#d1d5db",fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>📋 General Notes</label>
            <textarea value={plan.notes||""} onChange={e=>setPlan(prev=>({...prev,notes:e.target.value}))} rows={3} placeholder="e.g. Drink 3-4 liters of water today…"
              style={{width:"100%",background:"#27272a",border:"1px solid rgba(255,255,255,.1)",borderRadius:12,padding:"10px 13px",color:"#fff",fontSize:14,outline:"none",resize:"none"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"flex-end"}}>
            <button onClick={doSave} disabled={saving} style={{background:g,border:"none",color:"#fff",fontWeight:700,padding:"11px 26px",borderRadius:12,cursor:"pointer",fontSize:15,display:"flex",alignItems:"center",gap:8}}>
              {saving?<Spin s={18} c="#fff"/>:<><Ic n="Save" s={18} c="#fff"/>Save Diet Plan for {mem?.name}</>}
            </button>
          </div>
        </>
      )}

  );
}

function WorkoutTab({members,g,p,toast}){

  const [wtype,setWtype]=useState("");
  const [dur,setDur]=useState("");
  const [notes,setNotes]=useState("");
  const [exs,setExs]=useState([dEx()]);
  const [saving,setSaving]=useState(false);
  const [has,setHas]=useState(false);

  function dEx(){return{name:"",sets:3,reps:10,weight:"",muscle:"",link:"",notes:""};}

  useEffect(()=>{
    if(!mid)return;
    (async()=>{
      try{
        const recs=await dbGetWhere("igym_workout","member_id","==",mid);
        const f=recs.find(w=>w.date===date);
        if(f){setWtype(f.type||"");setDur(f.duration||"");setNotes(f.notes||"");setExs(f.exercises?.length?f.exercises:[dEx()]);setHas(true);}
        else{setWtype("");setDur("");setNotes("");setExs([dEx()]);setHas(false);}
      }catch(e){console.warn(e);setWtype("");setDur("");setNotes("");setExs([dEx()]);setHas(false);}
    })();
  },[mid,date]);

  const upEx=(i,f,v)=>setExs(prev=>prev.map((e,idx)=>idx===i?{...e,[f]:v}:e));

    if(!mid){toast("Select a member","error");return;}
    const valid=exs.filter(e=>e.name.trim());

      await dbSet("igym_workout",docId,{member_id:mid,date,type:wtype,duration:dur,notes,exercises:valid});
      toast("Workout plan "+(has?"updated":"created")+" for "+mem?.name+"!","success");

        </div>
        <div>
          <label style={{color:"#d1d5db",fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>📅 Select Date *</label>

function PlansTab({plans,g,p,toast,reload}){
  const [modal,setModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [fm,setFm]=useState({});
  const [feats,setFeats]=useState("");
  const [saving,setSaving]=useState(false);
  const up=v=>setFm(f=>({...f,...v}));

  const openCreate=()=>{setEditing(null);setFm({duration:30,hl:false,badge:""});setFeats("");setModal(true);};
  const openEdit=pl=>{setEditing(pl);setFm({...pl});setFeats((pl.features||[]).join("\n"));setModal(true);};
  const doDelete=async id=>{
    if(!confirm("Delete this plan?"))return;
    try{await dbDelete("igym_plans",id);toast("Plan deleted","success");reload();}
    catch(e){toast("Delete failed: "+e.message,"error");}
  };
  const doSave=async e=>{
    e.preventDefault();
    if(!fm.name?.trim()){toast("Plan name required","error");return;}
    setSaving(true);
    try{
      const docId=editing?.id||"pl"+Date.now();
      const data={...fm,features:feats.split("\n").map(f=>f.trim()).filter(Boolean),price:parseInt(fm.price)||0,duration:parseInt(fm.duration)||30};
      delete data.id;
      await dbSet("igym_plans",docId,data);
      toast("Plan saved! Landing page updated.","success");
      setModal(false);reload();
    }catch(err){toast("Save failed: "+err.message,"error");}
    setSaving(false);
  };

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:10}}>
        <div>
          <h2 style={{color:"#fff",fontWeight:900,fontSize:22}}>Membership Plans</h2>
          <p style={{color:"#6b7280",fontSize:13,marginTop:3}}>Changes reflect instantly on the landing page</p>
        </div>
        <button onClick={openCreate} style={{background:g,border:"none",color:"#fff",fontWeight:700,padding:"10px 18px",borderRadius:12,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",gap:6}}>
          <Ic n="Plus" s={16} c="#fff"/>Add Plan
        </button>

      <div style={{display:"flex",alignItems:"center",gap:8,background:"rgba(34,197,94,.08)",border:"1px solid rgba(34,197,94,.2)",borderRadius:12,padding:"10px 16px",marginBottom:20}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:"#22c55e",animation:"pulse 2s infinite",flexShrink:0}}/>
        <span style={{color:"#4ade80",fontSize:13,fontWeight:600}}>Live sync — changes appear on the landing page immediately</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:20}}>
        {plans.length===0?(
          <div style={{gridColumn:"1/-1",textAlign:"center",padding:52,background:"#18181b",borderRadius:20}}>
            <Ic n="CreditCard" s={44} c="#374151"/>
            <p style={{color:"#4b5563",marginTop:14}}>No plans yet. Create your first plan!</p>
          </div>
        ):plans.map(pl=>(
          <div key={pl.id} style={{background:"#18181b",border:"2px solid "+(pl.hl?p:"rgba(255,255,255,.1)"),borderRadius:22,overflow:"hidden"}}>
            {pl.badge&&<div style={{padding:"10px 18px"}}><span style={{background:g,color:"#fff",fontSize:11,fontWeight:700,padding:"3px 12px",borderRadius:100}}>{pl.badge}</span></div>}
            <div style={{padding:"16px 20px",borderBottom:"1px solid rgba(255,255,255,.08)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                <h3 style={{color:"#fff",fontWeight:900,fontSize:20}}>{pl.name}</h3>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>openEdit(pl)} style={{padding:"6px 7px",background:p+"15",border:"none",color:p,borderRadius:8,cursor:"pointer",display:"flex"}}><Ic n="Edit" s={14}/></button>
                  <button onClick={()=>doDelete(pl.id)} style={{padding:"6px 7px",background:"rgba(239,68,68,.1)",border:"none",color:"#f87171",borderRadius:8,cursor:"pointer",display:"flex"}}><Ic n="Trash" s={14}/></button>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                <span style={{fontSize:30,fontWeight:900,color:p}}>₹{pl.price.toLocaleString("en-IN")}</span>

              </div>
              {pl.desc&&<p style={{color:"#6b7280",fontSize:13,marginTop:6}}>{pl.desc}</p>}
            </div>
            <div style={{padding:"14px 20px"}}>
              {(pl.features||[]).map(f=>(
                <div key={f} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><Ic n="Check" s={14} c="#22c55e"/><span style={{color:"#d1d5db",fontSize:13}}>{f}</span></div>
              ))}
            </div>
          </div>
        ))}
      </div>

      {modal&&(
        <Modal title={editing?"Edit — "+editing.name:"Create New Plan"} onClose={()=>setModal(false)}>
          <form onSubmit={doSave}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
              <Field label="Plan Name *" value={fm.name||""} onChange={v=>up({name:v})} placeholder="Premium"/>

              </div>
            </div>
            <div style={{marginBottom:14}}>
              <label style={{color:"#d1d5db",fontSize:13,fontWeight:600,display:"block",marginBottom:6}}>Features (one per line)</label>
              <textarea value={feats} onChange={e=>setFeats(e.target.value)} rows={5} placeholder={"Gym Access\nPersonal Trainer (2x/week)\nCustom Diet Plan"}
                style={{width:"100%",background:"#27272a",border:"1px solid rgba(255,255,255,.12)",borderRadius:12,padding:"10px 13px",color:"#fff",fontSize:14,outline:"none",resize:"none"}}/>
            </div>
            <div style={{display:"flex",gap:10}}>
              <button type="button" onClick={()=>setModal(false)} style={{flex:1,padding:12,background:"#27272a",border:"none",color:"#d1d5db",borderRadius:12,cursor:"pointer",fontWeight:600}}>Cancel</button>
              <button type="submit" disabled={saving} style={{flex:1,padding:12,background:g,border:"none",color:"#fff",borderRadius:12,cursor:"pointer",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                {saving?<Spin s={18} c="#fff"/>:<><Ic n="Save" s={16} c="#fff"/>Save & Sync to Site</>}
              </button>
            </div>
          </form>
        </Modal>
      )}
    </div>
  );
}

//  ROOT APP
// ══════════════════════════════════════════════════════════════
function App(){
  const [ready,setReady]=useState(false);
  const [page,setPage]=useState("landing");
  const [td,setTd]=useState(null);

  useEffect(()=>{
    seedDB().then(async()=>{
      // Pull remote config so site customizer changes sync across devices
      try{await getCfgRemote();}catch(e){}
      const u=getSess();
      if(u)setPage(u.role==="admin"?"admin":"dashboard");
      setReady(true);
    });
  },[]);

  const toast=(msg,type="success")=>setTd({msg,type,k:Date.now()});

  if(!ready)return(
    <div style={{minHeight:"100vh",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{width:60,height:60,borderRadius:16,background:"linear-gradient(135deg,#f97316,#dc2626)",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <Ic n="Infinity" s={30} c="#fff"/>
      </div>
      <Spin s={32} c="#f97316"/>
      <p style={{color:"#6b7280",fontSize:14}}>Loading InfinityGym…</p>
    </div>
  );

  return(
    <div>
      {td&&<Toast key={td.k} msg={td.msg} type={td.type} onDone={()=>setTd(null)}/>}
      <Navbar page={page} setPage={setPage}/>
      {page==="landing"&&<Landing setPage={setPage}/>}
      {page==="login"&&<LoginPage setPage={setPage} toast={toast}/>}
      {page==="adminLogin"&&<AdminLoginPage setPage={setPage} toast={toast}/>}
      {page==="dashboard"&&<MemberDash setPage={setPage} toast={toast}/>}
      {page==="admin"&&<AdminDash setPage={setPage} toast={toast}/>}
    </div>
  );
}

function AdminLoginPage({setPage,toast}){
  const [id,setId]=useState("");
  const [pw,setPw]=useState("");
  const [showPw,setShowPw]=useState(false);
  const [loading,setLoading]=useState(false);
  const cfg=getCfg(),g=G(cfg),p=cfg.primary;

  const doLogin=async e=>{
    e.preventDefault();
    if(!id.trim()||!pw.trim()){toast("Fill in all fields","error");return;}
    setLoading(true);
    try{
      const members=await dbGetAll("igym_members");
      const user=members.find(u=>(u.member_id?.toLowerCase()===id.trim().toLowerCase()||u.email?.toLowerCase()===id.trim().toLowerCase())&&u.role==="admin");
      if(!user){toast("Admin account not found","error");setLoading(false);return;}
      const ok=await chkPw(pw,user.password_hash);
      if(!ok){toast("Wrong password","error");setLoading(false);return;}
      const tok=mkTok({id:user.id,member_id:user.member_id,name:user.name,role:user.role});
      setSess(tok,{id:user.id,member_id:user.member_id,name:user.name,role:user.role});
      toast("Welcome, "+user.name+"! 🔐","success");
      setTimeout(()=>setPage("admin"),600);
    }catch(err){toast("Login error: "+err.message,"error");}
    setLoading(false);
  };

  return(
    <div style={{minHeight:"100vh",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",padding:"80px 16px 24px"}}>
      <div style={{width:"100%",maxWidth:400}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{width:64,height:64,borderRadius:18,background:g,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}><Ic n="Shield" s={30} c="#fff"/></div>
          <h1 style={{color:"#fff",fontWeight:900,fontSize:24,marginBottom:4}}>Admin Access</h1>
          <p style={{color:"#6b7280",fontSize:13}}>This panel is restricted to administrators only</p>
        </div>
        <div style={{background:"#18181b",border:"1px solid rgba(255,255,255,.1)",borderRadius:22,padding:26}}>
          <form onSubmit={doLogin}>
            <div style={{marginBottom:14}}><Field label="Admin ID or Email" value={id} onChange={setId} placeholder="ADMIN001"/></div>
            <div style={{marginBottom:20,position:"relative"}}>
              <Field label="Password" value={pw} onChange={setPw} type={showPw?"text":"password"} placeholder="Admin password"/>
              <button type="button" onClick={()=>setShowPw(!showPw)} style={{position:"absolute",right:12,bottom:10,background:"none",border:"none",color:"#6b7280",cursor:"pointer",display:"flex"}}>
                <Ic n={showPw?"EyeOff":"Eye"} s={17}/>
              </button>
            </div>
            <button type="submit" disabled={loading} style={{width:"100%",background:g,border:"none",color:"#fff",fontWeight:700,padding:13,borderRadius:13,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {loading?<Spin s={20} c="#fff"/>:<><Ic n="Shield" s={18} c="#fff"/>Login to Admin Panel</>}
            </button>
          </form>
          <div style={{marginTop:16,padding:12,background:"rgba(249,115,22,.08)",border:"1px solid rgba(249,115,22,.2)",borderRadius:12}}>
            <p style={{color:"#fb923c",fontSize:12,textAlign:"center"}}>🔒 Access via Site Customizer only · Not publicly listed</p>
          </div>
        </div>
        <button onClick={()=>setPage("landing")} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:"#6b7280",cursor:"pointer",margin:"14px auto 0",fontSize:14}}>
          <Ic n="ChevL" s={16}/>Back to Home
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
